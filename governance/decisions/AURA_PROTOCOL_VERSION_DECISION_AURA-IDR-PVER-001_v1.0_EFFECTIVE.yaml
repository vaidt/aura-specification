decision:
  decision_id: "AURA-IDR-PVER-001"
  decision_type: "PROTOCOL_VERSION_BASELINE"
  proposed_protocol_version: "0.1.0-DRAFT"
  profile_name: "AURA-M0-BASELINE"
  release_class: "PRE_RELEASE"
  proposed_state: "DRAFT_BASELINE"
  version_1_0_claimed: false
  rationale: >-
    AURA requires an explicit protocol_version as part of its normative object
    contract, while the currently deployed implementation evidence includes
    `unspecified` values. The existing Wave 1 implementation authorization
    expressly prohibits mutation of `protocol_version`; therefore this record
    is a governance decision proposal, not a migration instruction. The value
    `0.1.0-DRAFT` is proposed as an initial pre-release baseline only. It is not
    inferred from implementation behavior, numeric ordering, or Git state.
  production_release_gate: >-
    AURA Protocol version 1.0 MUST NOT be claimed by this act. A 1.0 release
    remains subject to the applicable specification approval, compatibility,
    conformance, and release-control gates.

