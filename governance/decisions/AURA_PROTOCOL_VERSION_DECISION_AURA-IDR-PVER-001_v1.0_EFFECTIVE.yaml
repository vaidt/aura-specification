    its value is considered. Any repository outside the Wave 1 allowed paths
    requires separate authorization.

compatibility:
  breaking: "PROPOSED_NO"
  migration_required: "YES_AFTER_EFFECTIVENESS"
  migration_trigger: "Only after this IDR is effective and the relevant implementation authorization exists"
  migration_notes:
    - >-
      Implementations currently using `unspecified` MUST NOT be changed merely
      because this draft exists.
    - >-
      The JS/Python Binding Matrix drift (`1.3` versus `1.2`) MUST be treated
      separately from protocol_version and MUST NOT be silently conflated with
      this decision.
    - >-
      Cross-repository implementation changes require repository-specific
      authorization; this IDR does not grant that authorization.

versioning_contract:
  protocol_version_role: >-
    `protocol_version` identifies the normative protocol contract.
  schema_version_role: >-
    `schema_version` identifies the representation/schema contract for the
    relevant entity.
  compatibility_rule: >-
    Compatibility MUST be governed by an explicit compatibility matrix and
    MUST NOT be inferred solely from numeric ordering or string similarity.
