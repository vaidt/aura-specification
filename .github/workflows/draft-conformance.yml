name: Draft Conformance

on:
  push:
  pull_request:

jobs:
  draft-conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install "jcs==0.2.1" "jsonschema==4.10.3"

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run draft conformance runner
        run: python scripts/run-draft-conformance.py --json-out artifacts/draft-conformance-report.json

      - name: Upload draft conformance report
        uses: actions/upload-artifact@v4
        with:
          name: draft-conformance-report
          path: artifacts/draft-conformance-report.json
