name: AURA C6 Candidate Lab L0-L6 (Draft, observation-only)

on:
  push:
    branches:
      - "experiment/c6-candidate-lab-l0-l6-20261025"
    paths:
      - "scripts/stage_c/**"
      - "docs/completion/AURA_C6_CANDIDATE_LAB_SOURCE_LOCK_AND_PILOT_v0.1-DRAFT.md"
      - ".github/workflows/c6-candidate-lab.yml"
  pull_request:
    branches:
      - "analysis/c6-extended-candidate-corpus-20261025"
    paths:
      - "scripts/stage_c/**"
      - "docs/completion/AURA_C6_CANDIDATE_LAB_SOURCE_LOCK_AND_PILOT_v0.1-DRAFT.md"
      - ".github/workflows/c6-candidate-lab.yml"

permissions:
  contents: read

jobs:
  source-lock-materialize:
    name: L0 Source Lock + L2 isolated candidate materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      C6_LAB_DIR: "${{ runner.temp }}/c6-candidate-lab-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Checkout Candidate Lab commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Checkout exact historical baseline commit
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-specification
          ref: "6b4f3dcc46841bb17fafa3e1b1cc8ea9c0397330"
          path: baseline-source

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce L0 commit, Git blob and SHA-256 pins
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/verify_c6_source_lock.py \
            --candidate-root "$GITHUB_WORKSPACE" \
            --baseline-root "$GITHUB_WORKSPACE/baseline-source" \
            --output-dir "$C6_LAB_DIR"

      - name: Materialize 47 candidates into the isolated run directory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/materialize_c6_candidate_lab.py \
            --baseline-manifest "$C6_LAB_DIR/baseline-manifest.raw" \
            --inventory "$GITHUB_WORKSPACE/fixtures/corpus/STAGE-C-C6-EXTENDED-CANDIDATE-INVENTORY-v0.1-DRAFT.json" \
            --output-dir "$C6_LAB_DIR"

      - name: Validate all materialized bytes and the JSON pilot inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/validate_c6_candidate_materialization.py --root "$C6_LAB_DIR"

      - name: Upload L0-L2 candidate inputs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-candidate-materialization
          path: ${{ runner.temp }}/c6-candidate-lab-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90

  baseline-regression:
    name: L6 exact 27-case historical regression
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      ARCHITECTURE: "${{ matrix.arch }}"
      C6_BASELINE_DIR: "${{ runner.temp }}/c6-baseline-${{ matrix.arch }}"
      CORPUS_DIR: "${{ github.workspace }}/baseline-source/artifacts/stage-c/c6-wire-corpus"
    steps:
      - name: Checkout Candidate Lab source (including L6 verifier)
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Checkout exact integrated harness
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-specification
          ref: "38821305ddb93eca96d9eb86e53d5c2db5d91295"
          path: c6-harness

      - name: Checkout exact RI-PY/Core source
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-poc-a-core-v3.3
          ref: "fe3be05794d3f254d98af1464e598e5b9be2e369"
          path: aura-core

      - name: Checkout exact RI-RS/Aura-Guard source
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-guard-v1.3
          ref: "feab2d9c369cd5f8cbabe10d713d278b0b09da8b"
          path: aura-guard

      - name: Checkout exact historical C6 manifest and materializer
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-specification
          ref: "6b4f3dcc46841bb17fafa3e1b1cc8ea9c0397330"
          path: baseline-source

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Enforce exact L6 source commits and record source object identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$C6_BASELINE_DIR"
          test "$(git -C aura-core rev-parse HEAD)" = "fe3be05794d3f254d98af1464e598e5b9be2e369"
          test "$(git -C aura-guard rev-parse HEAD)" = "feab2d9c369cd5f8cbabe10d713d278b0b09da8b"
          test "$(git -C baseline-source rev-parse HEAD)" = "6b4f3dcc46841bb17fafa3e1b1cc8ea9c0397330"
          test "$(git -C c6-harness rev-parse HEAD)" = "38821305ddb93eca96d9eb86e53d5c2db5d91295"
          test "$(git -C baseline-source rev-parse HEAD:fixtures/corpus/STAGE-C-C6-STRICT-WIRE-MUTATION-CORPUS-v0.1-DRAFT.json)" = "d9b4a1f488185a44f7edb233ef8ff180981f0e84"
          {
            echo "architecture=$ARCHITECTURE"
            echo "core_commit=$(git -C aura-core rev-parse HEAD)"
            echo "core_receiver_blob=$(git -C aura-core rev-parse HEAD:conformance/boundary/ri_py_receiver.py)"
            echo "ri_rs_commit=$(git -C aura-guard rev-parse HEAD)"
            echo "ri_rs_parser_blob=$(git -C aura-guard rev-parse HEAD:conformance/strict_wire.rs)"
            echo "baseline_commit=$(git -C baseline-source rev-parse HEAD)"
            echo "baseline_manifest_blob=$(git -C baseline-source rev-parse HEAD:fixtures/corpus/STAGE-C-C6-STRICT-WIRE-MUTATION-CORPUS-v0.1-DRAFT.json)"
            echo "baseline_materializer_blob=$(git -C baseline-source rev-parse HEAD:scripts/stage_c/materialize_c6_wire_corpus.py)"
            echo "integrated_harness_commit=$(git -C c6-harness rev-parse HEAD)"
          } | tee "$C6_BASELINE_DIR/source-identities.txt"

      - name: Install Core package and declared dependencies
        run: python -m pip install --disable-pip-version-check -e aura-core

      - name: Materialize pinned 27-case baseline
        working-directory: baseline-source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/materialize_c6_wire_corpus.py \
            --manifest fixtures/corpus/STAGE-C-C6-STRICT-WIRE-MUTATION-CORPUS-v0.1-DRAFT.json \
            --output-dir artifacts/stage-c/c6-wire-corpus

      - name: Run RI-RS unit tests and the pinned shared corpus
        working-directory: aura-guard
        shell: bash
        env:
          AURA_C6_WIRE_CORPUS_DIR: ${{ github.workspace }}/baseline-source/artifacts/stage-c/c6-wire-corpus
          AURA_C6_WIRE_RESULTS_DIR: ${{ github.workspace }}/baseline-source/artifacts/stage-c/c6-wire-corpus/results
          AURA_RI_RS_COMMIT: "feab2d9c369cd5f8cbabe10d713d278b0b09da8b"
        run: |
          set -euo pipefail
          export AURA_RI_RS_SOURCE_BLOB="$(git rev-parse HEAD:conformance/strict_wire.rs)"
          export AURA_RI_RS_LIB_BLOB="$(git rev-parse HEAD:src/lib.rs)"
          export AURA_RI_RS_CARGO_BLOB="$(git rev-parse HEAD:Cargo.toml)"
          export AURA_RI_RS_TEST_BLOB="$(git rev-parse HEAD:conformance/strict_wire_c6.rs)"
          cargo test --locked --lib strict_wire::tests -- --nocapture
          cargo test --locked --test strict_wire_c6 -- --include-ignored --nocapture

      - name: Validate RI-RS preservation evidence and nine negative fixtures
        if: always()
        working-directory: aura-guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/c6-ri-rs-consumer
          python scripts/stage_c/validate_ri_rs_preservation.py 2>&1 | tee artifacts/c6-ri-rs-consumer/validator.log
          grep -Fxq "PRESERVATION_NEGATIVE_FIXTURES_PASS=9" artifacts/c6-ri-rs-consumer/validator.log
          python -m json.tool artifacts/c6-ri-rs-consumer/implementation-evidence.json >/dev/null
          python -m json.tool artifacts/c6-ri-rs-consumer/preservation-diagnostics.json >/dev/null

      - name: Run RI-PY on the same pinned 27-case baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python c6-harness/scripts/stage_c/run_ri_py_c6_consumer.py \
            --core-root "$GITHUB_WORKSPACE/aura-core" \
            --corpus-source-root "$GITHUB_WORKSPACE/baseline-source" \
            --corpus-dir "$CORPUS_DIR" \
            --architecture "$ARCHITECTURE" \
            --expected-core-commit "fe3be05794d3f254d98af1464e598e5b9be2e369" \
            --expected-corpus-commit "6b4f3dcc46841bb17fafa3e1b1cc8ea9c0397330"

      - name: Verify per-architecture integrated C6 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python c6-harness/scripts/stage_c/verify_integrated_c6.py per-arch \
            --core-root "$GITHUB_WORKSPACE/aura-core" \
            --guard-root "$GITHUB_WORKSPACE/aura-guard" \
            --corpus-source-root "$GITHUB_WORKSPACE/baseline-source" \
            --corpus-dir "$CORPUS_DIR" \
            --guard-evidence-dir "$GITHUB_WORKSPACE/aura-guard/artifacts/c6-ri-rs-consumer" \
            --harness-root "$GITHUB_WORKSPACE/c6-harness" \
            --architecture "$ARCHITECTURE" \
            --expected-core-commit "fe3be05794d3f254d98af1464e598e5b9be2e369" \
            --expected-ri-rs-commit "feab2d9c369cd5f8cbabe10d713d278b0b09da8b" \
            --expected-corpus-commit "6b4f3dcc46841bb17fafa3e1b1cc8ea9c0397330" \
            --expected-harness-commit "38821305ddb93eca96d9eb86e53d5c2db5d91295"

      - name: Enforce byte-identical L6 historical report hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/verify_c6_historical_regression.py \
            --corpus-dir "$CORPUS_DIR" \
            --core-root "$GITHUB_WORKSPACE/aura-core" \
            --guard-root "$GITHUB_WORKSPACE/aura-guard" \
            --source-root "$GITHUB_WORKSPACE/baseline-source" \
            --harness-root "$GITHUB_WORKSPACE/c6-harness" \
            --output "$C6_BASELINE_DIR/baseline-regression-report.json"

      - name: Assemble per-architecture baseline evidence for the lab
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$C6_BASELINE_DIR/corpus" "$C6_BASELINE_DIR/ri-rs-evidence"
          if [[ -d "$CORPUS_DIR" ]]; then cp -a "$CORPUS_DIR/." "$C6_BASELINE_DIR/corpus/"; fi
          if [[ -d "$GITHUB_WORKSPACE/aura-guard/artifacts/c6-ri-rs-consumer" ]]; then
            cp -a "$GITHUB_WORKSPACE/aura-guard/artifacts/c6-ri-rs-consumer/." "$C6_BASELINE_DIR/ri-rs-evidence/"
          fi

      - name: Upload L6 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-baseline-${{ matrix.arch }}
          path: ${{ runner.temp }}/c6-baseline-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 90

  json-pilot:
    name: L4-L5 RI-PY / RI-RS JSON observation pilot
    needs: [source-lock-materialize, baseline-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      C6_LAB_DIR: ${{ runner.temp }}/c6-candidate-pilot-${{ github.run_id }}-${{ github.run_attempt }}
      C6_PILOT_DIR: ${{ runner.temp }}/c6-json-pilot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Candidate Lab source
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Checkout exact RI-PY/Core source
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-poc-a-core-v3.3
          ref: "fe3be05794d3f254d98af1464e598e5b9be2e369"
          path: aura-core

      - name: Checkout exact RI-RS/Aura-Guard source
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-guard-v1.3
          ref: "feab2d9c369cd5f8cbabe10d713d278b0b09da8b"
          path: aura-guard

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Download the validated isolated candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: c6-candidate-materialization
          path: ${{ runner.temp }}/c6-candidate-pilot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Recheck parser source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C aura-core rev-parse HEAD)" = "fe3be05794d3f254d98af1464e598e5b9be2e369"
          test "$(git -C aura-guard rev-parse HEAD)" = "feab2d9c369cd5f8cbabe10d713d278b0b09da8b"
          python -m pip install --disable-pip-version-check -e aura-core
          mkdir -p "$C6_PILOT_DIR"

      - name: Observe the eight JSON transport/syntax candidates with RI-PY
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/observe_c6_json_candidates.py \
            --core-root "$GITHUB_WORKSPACE/aura-core" \
            --index "$C6_LAB_DIR/materialization-index.json" \
            --lab-root "$C6_LAB_DIR" \
            --output "$C6_PILOT_DIR/ri-py-json-observations.json"

      - name: Run observation-only RI-RS example on identical candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aura-guard/examples
          cp scripts/stage_c/c6_candidate_observer.rs aura-guard/examples/c6_candidate_observer.rs
          cargo run --locked --manifest-path aura-guard/Cargo.toml \
            --example c6_candidate_observer -- \
            --index "$C6_LAB_DIR/materialization-index.json" \
            --lab-root "$C6_LAB_DIR" \
            --guard-root "$GITHUB_WORKSPACE/aura-guard" \
            --output "$C6_PILOT_DIR/ri-rs-json-observations.json"

      - name: Compare observation reports without assigning expected outcomes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/compare_c6_json_observations.py \
            --index "$C6_LAB_DIR/materialization-index.json" \
            --ri-py "$C6_PILOT_DIR/ri-py-json-observations.json" \
            --ri-rs "$C6_PILOT_DIR/ri-rs-json-observations.json" \
            --output "$C6_PILOT_DIR/differential-report.json"

      - name: Upload JSON pilot observations and differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-json-pilot
          path: ${{ runner.temp }}/c6-json-pilot-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90

  assemble-evidence:
    name: L7 assemble evidence package (non-constitutive)
    if: always()
    needs: [source-lock-materialize, baseline-regression, json-pilot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      C6_INCOMING: ${{ runner.temp }}/c6-evidence-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      C6_OUT: ${{ runner.temp }}/c6-candidate-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Candidate Lab package assembler
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated assembly directories
        run: |
          mkdir -p "$C6_INCOMING/materialization" "$C6_INCOMING/baseline" "$C6_INCOMING/pilot"

      - name: Download candidate materialization (if available)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: c6-candidate-materialization
          path: ${{ runner.temp }}/c6-evidence-inputs-${{ github.run_id }}-${{ github.run_attempt }}/materialization

      - name: Download per-architecture baseline evidence (if available)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: c6-baseline-*
          path: ${{ runner.temp }}/c6-evidence-inputs-${{ github.run_id }}-${{ github.run_attempt }}/baseline
          merge-multiple: false

      - name: Download JSON pilot reports (if available)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: c6-json-pilot
          path: ${{ runner.temp }}/c6-evidence-inputs-${{ github.run_id }}-${{ github.run_attempt }}/pilot

      - name: Assemble nine logical evidence components
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_c/assemble_c6_candidate_evidence.py \
            --materialization-dir "$C6_INCOMING/materialization" \
            --baseline-dir "$C6_INCOMING/baseline" \
            --pilot-dir "$C6_INCOMING/pilot" \
            --output-dir "$C6_OUT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload complete or partial evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-candidate-lab-evidence
          path: ${{ runner.temp }}/c6-candidate-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90
