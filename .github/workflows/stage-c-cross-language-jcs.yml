name: Stage C Python Rust JCS cross-language comparison

on:
  push:
    branches:
      - "experiment/stage-c-adapter-contract-20261023"
    paths:
      - "scripts/stage_c/**"
      - "fixtures/corpus/CANONICAL-003_jcs_full_discriminator.json"
      - "fixtures/corpus/CANONICAL-003_jcs_full_discriminator.expected.jcs"
      - ".github/workflows/stage-c-cross-language-jcs.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/stage_c/**"
      - "fixtures/corpus/CANONICAL-003_jcs_full_discriminator.json"
      - "fixtures/corpus/CANONICAL-003_jcs_full_discriminator.expected.jcs"
      - ".github/workflows/stage-c-cross-language-jcs.yml"

permissions:
  contents: read

jobs:
  cross-language-jcs:
    name: Isolated RI-PY / RI-RS JCS byte comparison (non-normative)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout specification experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python JCS engine
        run: python -m pip install --disable-pip-version-check -r scripts/stage_c/requirements.txt

      - name: Run isolated Python JCS contract tests
        run: python -m unittest discover -s scripts/stage_c -p 'test_python_jcs_probe.py' -v

      - name: Create Python invocation request
        shell: bash
        run: |
          mkdir -p artifacts/stage-c/python-jcs
          cat > artifacts/stage-c/python-jcs/request.json <<EOF
          {
            "schema": "AURA-STAGE-C-ADAPTER-REQUEST/0.1",
            "run_id": "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
            "operation": "jcs.canonicalize",
            "fixture_id": "CANONICAL-003",
            "input_path": "fixtures/corpus/CANONICAL-003_jcs_full_discriminator.json",
            "json_pointer": "/protocol_object",
            "source_commit": "${GITHUB_SHA}"
          }
          EOF

      - name: Execute Python JCS shim
        run: |
          python scripts/stage_c/python_jcs_probe.py \
            --request artifacts/stage-c/python-jcs/request.json \
            --response artifacts/stage-c/python-jcs/response.json \
            --output-octets artifacts/stage-c/python-jcs/canonical.bin \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Independently verify Python output bytes
        shell: bash
        run: |
          expected='fixtures/corpus/CANONICAL-003_jcs_full_discriminator.expected.jcs'
          actual='artifacts/stage-c/python-jcs/canonical.bin'
          cmp --silent "$expected" "$actual"
          test "$(wc -c < "$actual" | tr -d ' ')" = "577"
          output_sha="$(sha256sum "$actual" | awk '{print $1}')"
          test "$output_sha" = "9fb648c388c4485575d25c1d6171ba691fec51c1b433b11f4d61197bbe2a5509"
          leaf_sha="$(python -c 'import hashlib, pathlib; print(hashlib.sha256(bytes([0]) + pathlib.Path("artifacts/stage-c/python-jcs/canonical.bin").read_bytes()).hexdigest())')"
          test "$leaf_sha" = "38672ea2bd0ea87b2446efce8d4ba4adeb822e0baaecee4a54b73179198d2b3e"

      - name: Checkout pinned Rust JCS adapter
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-guard-v1.3
          ref: d1b8c070e00b7a7b1685382f13d051543cae8e64
          path: aura-guard

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Run Rust shim contract tests
        env:
          AURA_SPECIFICATION_ROOT: ${{ github.workspace }}
        run: cargo test --locked --manifest-path aura-guard/Cargo.toml --example stage_c_jcs_probe -- --nocapture

      - name: Create equivalent Rust invocation request
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request_path = Path("artifacts/stage-c/python-jcs/request.json")
          request = json.loads(request_path.read_bytes())
          request["source_commit"] = "d1b8c070e00b7a7b1685382f13d051543cae8e64"
          Path("artifacts/stage-c/rust-jcs").mkdir(parents=True, exist_ok=True)
          Path("artifacts/stage-c/rust-jcs/request.json").write_text(
              json.dumps(request, ensure_ascii=False, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Execute Rust JCS shim
        env:
          AURA_SPECIFICATION_ROOT: ${{ github.workspace }}
        run: |
          cargo run --locked --manifest-path aura-guard/Cargo.toml --example stage_c_jcs_probe -- \
            --request artifacts/stage-c/rust-jcs/request.json \
            --response artifacts/stage-c/rust-jcs/response.json \
            --output-octets artifacts/stage-c/rust-jcs/canonical.bin \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Independently verify Rust bytes and cross-language equality
        shell: bash
        run: |
          expected='fixtures/corpus/CANONICAL-003_jcs_full_discriminator.expected.jcs'
          python_bytes='artifacts/stage-c/python-jcs/canonical.bin'
          rust_bytes='artifacts/stage-c/rust-jcs/canonical.bin'
          cmp --silent "$expected" "$rust_bytes"
          cmp --silent "$python_bytes" "$rust_bytes"
          test "$(wc -c < "$rust_bytes" | tr -d ' ')" = "577"
          output_sha="$(sha256sum "$rust_bytes" | awk '{print $1}')"
          test "$output_sha" = "9fb648c388c4485575d25c1d6171ba691fec51c1b433b11f4d61197bbe2a5509"
          leaf_sha="$(python -c 'import hashlib, pathlib; print(hashlib.sha256(bytes([0]) + pathlib.Path("artifacts/stage-c/rust-jcs/canonical.bin").read_bytes()).hexdigest())')"
          test "$leaf_sha" = "38672ea2bd0ea87b2446efce8d4ba4adeb822e0baaecee4a54b73179198d2b3e"
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path("artifacts/stage-c/python-jcs/response.json").read_bytes())
          rs = json.loads(Path("artifacts/stage-c/rust-jcs/response.json").read_bytes())
          py_bytes = Path("artifacts/stage-c/python-jcs/canonical.bin").read_bytes()
          rs_bytes = Path("artifacts/stage-c/rust-jcs/canonical.bin").read_bytes()
          assert py["schema"] == rs["schema"] == "AURA-STAGE-C-ADAPTER-RESPONSE/0.1"
          assert py["run_id"] == rs["run_id"]
          assert py["operation"] == rs["operation"] == "jcs.canonicalize"
          assert py["execution_status"] == rs["execution_status"] == "COMPLETED"
          assert py["authority"] == rs["authority"] == "NONE"
          assert py_bytes == rs_bytes
          assert py["output"]["sha256"] == rs["output"]["sha256"]
          report = {
              "schema": "AURA-STAGE-C-CROSS-LANGUAGE-JCS-COMPARISON/0.1",
              "run_id": py["run_id"],
              "fixture_id": "CANONICAL-003",
              "python_adapter": py["adapter"],
              "rust_adapter": rs["adapter"],
              "output_octet_length": len(py_bytes),
              "python_output_sha256": py["output"]["sha256"],
              "rust_output_sha256": rs["output"]["sha256"],
              "byte_for_byte_equal": True,
              "matches_committed_expected_jcs": True,
              "technical_scope": "single experimental vector only",
              "normative_effect": "NONE",
              "release_effect": "NONE",
              "note": "This comparison does not ratify DQ-006/DQ-002 or close Stage C."
          }
          Path("artifacts/stage-c/comparison.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          echo "Rust exact expected-byte comparison: matched"
          echo "Python/Rust cross-language byte comparison: matched"
          echo "Canonical SHA-256: $output_sha"
          echo "RFC 6962 leaf SHA-256 (probe only): $leaf_sha"

      - name: Upload cross-language evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c-cross-language-jcs
          path: artifacts/stage-c/
          if-no-files-found: warn
          retention-days: 14
